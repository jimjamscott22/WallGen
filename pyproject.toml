[project]
name = "wallgen"
version = "0.1.0"
description = "Procedural desktop wallpapers for Windows."
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11",
    "pillow>=11",
    "numpy>=2",
    "comtypes>=1.4 ; sys_platform == 'win32'",
]

[project.scripts]
wallgen = "wallgen.__main__:main"

[dependency-groups]
build = [
    "pyinstaller>=6.10",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wallgen"]
